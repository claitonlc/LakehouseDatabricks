# This is a Declarative Automation Bundle definition for grid_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: 0bbd7185-3ee9-4718-888b-3fea7d73c8e4

include:
  - resources/*.yml

experimental:
  skip_name_prefix_for_schema: true

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  warehouse_id:
    description: SQL Warehouse ID for metric view and SQL tasks

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-2e4f52fb-96e3.cloud.databricks.com
    variables:
      catalog: grid_dev
      warehouse_id: da15f79585892515  # Serverless Starter Warehouse
  prod:
    mode: production
    workspace:
      host: https://dbc-2e4f52fb-96e3.cloud.databricks.com
      root_path: /Workspace/Users/claitonlc@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
      warehouse_id: da15f79585892515  # Serverless Starter Warehouse
    permissions:
      - user_name: claitonlc@gmail.com
        level: CAN_MANAGE
